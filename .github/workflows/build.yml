name: Kernel source and build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    name: Discover validation targets
    uses: ./.github/workflows/targets.yml
  source:
    name: Transpile source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Transpile source from pinned toolchain
        run: bash scripts/regenerate.sh
      - name: Upload generated source
        uses: actions/upload-artifact@v6
        with:
          name: rusty-rei-generated-source
          path: |
            src/
            Cargo.toml
            crust.manifest.json
          if-no-files-found: error
  compile:
    name: Compile (${{ matrix.arch }})
    needs: [source, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove old generated source
        run: rm -rf src
      - name: Download generated source
        uses: actions/download-artifact@v7
        with:
          name: rusty-rei-generated-source
          path: .
      - name: Verify generated source
        shell: bash
        run: |
          test -f Cargo.toml
          test -f crust.manifest.json
          test -f src/lib.rs
          test -z "$(git ls-files -- '*.c' '*.h' '*.S')"
          test -z "$(git ls-files -- dist platform target '*.o' '*.a' '*.so' '*.elf' '*.img' '*.bin' '*.wasm' '*.rlib')"
          test ! -e platform
          bash -n scripts/build.sh scripts/regenerate.sh scripts/verify-pins.sh
          grep -Fxq '#![no_std]' src/lib.rs
          grep -Fxq '#![forbid(unsafe_code)]' src/lib.rs
      - name: Install Target Toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          BUILD_STD: ${{ toJSON(matrix.buildStd) }}
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          if [[ "$BUILD_STD" == true ]]; then
            rustup component add rust-src --toolchain "$TOOLCHAIN"
            rustc +"$TOOLCHAIN" --print target-list | grep -Fx "$TARGET"
          else
            rustup target add "$TARGET" --toolchain "$TOOLCHAIN"
          fi
      - name: Compile freshly generated source
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          BUILD_STD: ${{ toJSON(matrix.buildStd) }}
          RUSTFLAGS: -D warnings -C panic=abort
        run: |
          set -euo pipefail
          if [[ "$BUILD_STD" == true ]]; then
            cargo +"$TOOLCHAIN" build -Z build-std=core,compiler_builtins --release -j 2 --target "$TARGET" --lib
          else
            cargo +"$TOOLCHAIN" build --release -j 2 --target "$TARGET" --lib
          fi
          test -s "target/$TARGET/release/libcrust_kernel.rlib"
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src Cargo.toml crust.manifest.json
          git diff --cached --exit-code
