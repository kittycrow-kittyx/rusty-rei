name: Kernel source and build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    name: Discover validation targets
    uses: ./.github/workflows/targets.yml
    with:
      source_sha: ${{ github.sha }}
  source:
    name: Transpile source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Verify build scripts
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Verify upstream pins
        run: bash scripts/verify-pins.sh
      - name: Download upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-upstream.sh
      - name: Install upstream dependencies
        run: |
          bun install --cwd build/upstream/crust --frozen-lockfile
          bun install --cwd build/upstream/crust/bake --frozen-lockfile
      - name: Transpile source
        run: bash scripts/regenerate.sh --source-only
      - name: Upload generated source
        uses: actions/upload-artifact@v6
        with:
          name: rusty-rei-generated-source
          path: |
            src/
            Cargo.toml
            crust.manifest.json
            docs/bake-manifest.json
            docs/provenance.md
            SHA256SUMS
          if-no-files-found: error
  compile:
    name: Compile (${{ matrix.arch }})
    needs: [source, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Remove old generated source
        run: rm -rf src
      - name: Download generated source
        uses: actions/download-artifact@v7
        with:
          name: rusty-rei-generated-source
          path: .
      - name: Verify generated source
        run: bash scripts/verify-source.sh
      - name: Set up Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          BUILD_STD: ${{ toJSON(matrix.buildStd) }}
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          if [[ "$BUILD_STD" == true ]]; then
            rustup component add rust-src --toolchain "$TOOLCHAIN"
            rustc +"$TOOLCHAIN" --print target-list | grep -Fx "$TARGET"
          else
            rustup target add "$TARGET" --toolchain "$TOOLCHAIN"
          fi
      - name: Compile Rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          BUILD_STD: ${{ toJSON(matrix.buildStd) }}
        run: bash scripts/compile-target.sh "$TARGET" "$TOOLCHAIN" "$BUILD_STD"
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src Cargo.toml crust.manifest.json docs/bake-manifest.json docs/provenance.md SHA256SUMS
          git diff --cached --exit-code
