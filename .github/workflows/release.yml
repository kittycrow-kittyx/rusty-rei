name: Release

on:
  workflow_run:
    workflows: [Kernel source and build validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  select:
    name: Validate source
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VALIDATION_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    outputs:
      source: ${{ steps.version.outputs.source }}
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'tag=%s\nsource=%s\n' "$tag" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'package=true\npublish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/actions/runs/$VALIDATION_RUN_ID" | jq -e --arg sha "$SOURCE_SHA" --arg repo "$GH_REPO" '.name == "Kernel source and build validation" and .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .event == "push" and .status == "completed" and .conclusion == "success"'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            printf 'package=false\npublish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          if [[ -z "$ref" ]]; then ref="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"; fi
          [[ -z "$ref" || "$ref" == "$SOURCE_SHA" ]]
          printf 'package=true\npublish=true\n' >> "$GITHUB_OUTPUT"
  targets:
    name: Discover release targets
    needs: select
    if: needs.select.outputs.package == 'true'
    uses: ./.github/workflows/targets.yml
    with:
      source_sha: ${{ needs.select.outputs.source }}
  build:
    name: Build (${{ matrix.arch }})
    needs: [select, targets]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ needs.select.outputs.source }}
      TAG: ${{ needs.select.outputs.tag }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      ELF_CLASS: ${{ matrix.elf }}
      MACHINE: ${{ matrix.machine }}
      BUILD_STD: ${{ toJSON(matrix.buildStd) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Set up Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Install target
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [[ "$BUILD_STD" == true ]]; then
            rustup component add rust-src --toolchain "$TOOLCHAIN"
            rustc +"$TOOLCHAIN" --print target-list | grep -Fx "$TARGET"
          else
            rustup target add "$TARGET" --toolchain "$TOOLCHAIN"
          fi
      - name: Verify generated source
        run: bash scripts/verify-source.sh
      - name: Compile Rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: bash scripts/compile-target.sh "$TARGET" "$TOOLCHAIN" "$BUILD_STD"
      - name: Stage distribution
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          mkdir -p package/lib build/verify
          cp "build/native/$TARGET/libcrust_kernel.rlib" package/lib/
          cp -R src Cargo.toml crust.manifest.json LICENSE VERSION docs/provenance.md upstream.releases.json package/
          printf '%s\n' "$SOURCE_SHA" > package/RELEASE_COMMIT
          rustc +"$TOOLCHAIN" -vV > package/COMPILER.txt
          cargo +"$TOOLCHAIN" --version >> package/COMPILER.txt
          printf '\nTarget: %s\nRUSTFLAGS: -D warnings -C panic=abort\n' "$TARGET" >> package/COMPILER.txt
          test -s package/lib/libcrust_kernel.rlib
          (cd build/verify && ar x ../../package/lib/libcrust_kernel.rlib)
      - name: Record upstream target policy
        env:
          TARGET_POLICY: ${{ needs.targets.outputs.matrix }}
          TARGET_REVISION: ${{ needs.targets.outputs.revision }}
          TARGET_PROFILE: ${{ toJSON(matrix) }}
        run: |
          jq . <<< "$TARGET_POLICY" > package/TARGETS.json
          jq . <<< "$TARGET_PROFILE" > package/TARGET.json
          printf 'kittycrow-kittyx/crust@%s\n' "$TARGET_REVISION" > package/TARGETS_REVISION
      - name: Verify architecture
        run: |
          shopt -s nullglob
          objects=(build/verify/*.o)
          test "${#objects[@]}" -gt 0
          for object in "${objects[@]}"; do
            header="$(LC_ALL=C readelf -h "$object")"
            machine="$(printf '%s\n' "$header" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            class="$(printf '%s\n' "$header" | sed -n 's/^[[:space:]]*Class:[[:space:]]*//p')"
            test "$machine" = "$MACHINE"
            test "$class" = "$ELF_CLASS"
          done
      - name: Package distribution
        run: |
          mkdir -p dist
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner \
            -czf "dist/rusty-rei-$TAG-$ARCH.tar.gz" -C package .
          tar -tzf "dist/rusty-rei-$TAG-$ARCH.tar.gz"
      - name: Upload release artefact
        uses: actions/upload-artifact@v6
        with:
          name: rusty-rei-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.select.outputs.publish == 'true'
    needs: [select, targets, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.select.outputs.source }}
      TAG: ${{ needs.select.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Download release artefacts
        uses: actions/download-artifact@v7
        with:
          pattern: rusty-rei-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        env:
          TARGET_POLICY: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          cd release
          mapfile -t architectures < <(jq -er '.include[].arch' <<< "$TARGET_POLICY")
          test "${#architectures[@]}" -gt 0
          expected=()
          for arch in "${architectures[@]}"; do
            archive="rusty-rei-$TAG-$arch.tar.gz"
            test -s "$archive"
            expected+=("$archive")
          done
          shopt -s nullglob
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          for archive in release/*.tar.gz; do
            test "$(tar -xOf "$archive" ./RELEASE_COMMIT)" = "$SOURCE_SHA"
          done
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            exit 0
          fi
          ref="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [[ -z "$ref" ]]; then ref="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"; fi
          if [[ -z "$ref" ]]; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "$TAG" "$SOURCE_SHA" -m "Rusty Rei $TAG"
            git push origin "refs/tags/$TAG"
          else
            test "$ref" = "$SOURCE_SHA"
          fi
          gh release create "$TAG" release/*.tar.gz release/SHA256SUMS --repo "$GH_REPO" --verify-tag --generate-notes --title "Rusty Rei $TAG"
          download="$(mktemp -d)"
          gh release download "$TAG" --repo "$GH_REPO" --pattern '*.tar.gz' --pattern SHA256SUMS --dir "$download"
          (cd "$download" && sha256sum -c SHA256SUMS)
          for file in release/*; do cmp "$file" "$download/${file##*/}"; done
          ref="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          test "$ref" = "$SOURCE_SHA"

  consolidate:
    name: Consolidate existing v2.2.0 release
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify and consolidate existing release
        run: bash scripts/ci/consolidate-release.sh
